services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: odonto_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # A porta 5432 já está ocupada por outro PostgreSQL no Windows.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odonto_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  moto:
    # Emulador S3 open-source para desenvolvimento local, sem conta ou licença.
    image: motoserver/moto:5.2.3
    environment:
      MOTO_PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
